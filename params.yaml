# DVC Parameters Configuration
# Override default values in dvc.yaml by editing this file.
# Run `dvc repro` after making changes to rebuild only affected stages.

# ---------------------------------------------------------------------------
# Top-level shorthand parameters (used directly in dvc.yaml stage commands)
# ---------------------------------------------------------------------------

# Path to the source PDF (relative to the rag_llm_app/ working directory)
pdf_path: "data/documents/Human-Nutrition-2020-Edition-1598491699.pdf"

# ---------------------------------------------------------------------------
# Structured parameters (grouped by concern)
# ---------------------------------------------------------------------------

# Document source configuration
document:
  pdf_path: "rag_llm_app/data/documents/Human-Nutrition-2020-Edition-1598491699.pdf"
  doc_id: "nutrition-v1"

# Embedding Configuration
embedding:
  model: "text-embedding-3-small"
  batch_size: 100

# Chunking Configuration
chunking:
  sentences_per_chunk: 20
  sentence_overlap: 2
  max_tokens: 1300
  min_tokens: 50

# Database Configuration
database:
  batch_insert: 200

# Retrieval Configuration
retrieval:
  top_k: 5
  similarity_threshold: 0.7

# Generation Configuration
generation:
  temperature: 0.7
  max_tokens: 512
